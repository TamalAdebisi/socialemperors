# Makes the new game client's sprite sheets from the game's Flash files
# (tools/export_art.sh, CLIENT.md) and puts them in the R2 bucket under art/,
# where the client's page finds them (SE_ASSETS_URL/art). See DEPLOY.md.
#
# Run it by hand: GitHub -> Actions -> "Export art to R2" -> Run workflow.
# The sheets still missing are shared between 8 machines (sheets already in
# the bucket are not made again), so running it again only adds what's
# missing, on all 8; name items under
# "Make these again" to redo a few, or tick "Make every sheet again" after a
# change that affects them all. "Make big units again" redoes every item of
# several pages (big units, bosses, the ground) packed before as it is now:
# move by move, with each page's mask and KTX2 files too, units at the
# game's size (CLIENT.md, "Light art"); and every unit stored smaller under
# a smaller budget of pages (tools/art/pack_sheet.py --outdated). Their pages
# get new names (<page>.m2.webp), so the cache serves no old picture with a
# new JSON file and nothing needs purging; the old pages stay unused.
#
# Each machine stops making sheets in time to send what it has made before
# GitHub's limit of 6 hours a job. If that leaves some, the run ends in red,
# saying so: run it again, with the same boxes ticked, for the rest.
name: Export art to R2

on:
  workflow_dispatch:
    inputs:
      redo:
        description: Make every sheet again, even those already in the bucket
        type: boolean
        default: false
      items:
        description: Make these again (item names, like 1403_deco 1456_dragon_statue)
        type: string
        default: ""
      big:
        description: Make big units again (every item of several pages or stored smaller), move by move, at full size, with KTX2
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    # GitHub's most for a job is 360 minutes; the making stops at 325 (below).
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      BUCKET: socialempires-assets
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Newer AWS CLI versions add checksums R2 may reject; send them only when required.
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      # Eight machines read and write the bucket at once, and R2 sometimes asks
      # one to slow down ("ServiceUnavailable"): wait and try again, up to 10 times.
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: "10"
      # A day: a new export reaches players by the next day at the latest.
      CACHE: public, max-age=86400
      # The JSON files, five minutes: an item made again names new pages (named by what they show,
      # tools/art/pack_sheet.py), and its <item>.json, the one file that keeps its name, says which.
      JSON_CACHE: public, max-age=300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Pillow (the packer's image library)
        run: pip install Pillow==12.3.0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install the KTX2 encoder (tools/art/ktx2.mjs)
        run: npm ci --prefix tools/art

      - name: Keep FFDec between runs (tools/ffdec.sh builds it into .tools/)
        uses: actions/cache@v6
        with:
          path: .tools
          key: ffdec-${{ hashFiles('tools/ffdec.sh') }}

      - name: Note the sheets already in the bucket (their JSON files only)
        if: ${{ !inputs.redo }}
        env:
          ITEMS: ${{ inputs.items }}
        # A file that still doesn't come after three tries only means its item
        # is made again: never a reason to stop this machine.
        run: |
          for try in 1 2 3; do
            aws s3 sync "s3://$BUCKET/art/" art/sheets/ --endpoint-url "$ENDPOINT" --exclude "*" --include "*.json" --only-show-errors && break
            echo "Some files didn't come (try $try of 3); trying again."
            sleep $((15 * try))
          done
          for item in $ITEMS; do rm -f "art/sheets/$item.json" "art/sheets/$item"-*.json; done
          # Big units again: the items not yet packed as now (pack_sheet.py, outdated). Those
          # already made again, by an earlier run that stopped part way, stay.
          if [ "${{ inputs.big }}" = "true" ]; then
            python tools/art/pack_sheet.py --outdated art/sheets > "$RUNNER_TEMP/outdated"
            echo "$(wc -l < "$RUNNER_TEMP/outdated") items to make again."
            while read -r item; do rm -f "art/sheets/$item.json" "art/sheets/$item"-*.json; done < "$RUNNER_TEMP/outdated"
          fi

      - name: Make this machine's share of the sheets, sending them as they come
        # Every minute, what's finished goes to the bucket: it fills as the
        # work goes on, and a machine that stops keeps what it has done. The
        # pictures first, by size; then the JSON files made here, whatever
        # their size (an item made again keeps its JSON's name, and may keep
        # its size), oldest first, so an item's first JSON, written last,
        # goes up after its other pages'. At 325 minutes the making stops, so
        # the rest is sent within GitHub's limit (the next step).
        run: |
          touch "$RUNNER_TEMP/started"
          : > "$RUNNER_TEMP/sent"
          send() {
            aws s3 sync art/sheets/ "s3://$BUCKET/art/" --endpoint-url "$ENDPOINT" --size-only \
              --exclude "*.tmp" --exclude "*.json" --cache-control "$CACHE" --only-show-errors || true
            find art/sheets -maxdepth 1 -name "*.json" -newer "$RUNNER_TEMP/started" -printf "%T@ %p\n" \
              | sort -n | cut -d " " -f 2- | while read -r json; do
                grep -qxF "$json" "$RUNNER_TEMP/sent" && continue
                aws s3 cp "$json" "s3://$BUCKET/art/$(basename "$json")" --endpoint-url "$ENDPOINT" \
                  --cache-control "$JSON_CACHE" --only-show-errors && echo "$json" >> "$RUNNER_TEMP/sent"
              done
          }
          (while sleep 60; do send; done) &
          uploader=$!
          status=0
          SHARD=${{ matrix.shard }}/8 KTX2=1 timeout --kill-after=2m 325m tools/export_art.sh || status=$?
          kill "$uploader" || true
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "Stopped at 325 minutes, to send what's made before GitHub's limit."
            touch "$RUNNER_TEMP/unfinished"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Upload the rest
        # Even if making them stopped early: whatever was made goes up.
        # Normally by size, so the JSON files fetched above stay as they are;
        # when making everything again, every file. The pictures before the
        # JSON files that name them.
        if: ${{ !cancelled() }}
        env:
          ITEMS: ${{ inputs.items }}
        run: |
          compare="--size-only"
          if [ "${{ inputs.redo }}" = "true" ]; then compare=""; fi
          aws s3 sync art/sheets/ "s3://$BUCKET/art/" --endpoint-url "$ENDPOINT" $compare --exclude "*.tmp" --exclude "*.json" \
            --cache-control "$CACHE" --no-progress
          aws s3 sync art/sheets/ "s3://$BUCKET/art/" --endpoint-url "$ENDPOINT" $compare --exclude "*" --include "*.json" \
            --cache-control "$JSON_CACHE" --no-progress
          # Big units made again: their JSON files, whatever their size (their pages have new names).
          if [ "${{ inputs.big }}" = "true" ]; then
            aws s3 sync art/sheets/ "s3://$BUCKET/art/" --endpoint-url "$ENDPOINT" --exclude "*" --include "*.json" \
              --cache-control "$JSON_CACHE" --no-progress
          fi
          # The items made again, whatever their size.
          for item in $ITEMS; do
            aws s3 sync art/sheets/ "s3://$BUCKET/art/" --endpoint-url "$ENDPOINT" --exclude "*" \
              --include "$item.*" --include "$item-*" --exclude "*.json" --cache-control "$CACHE" --no-progress
            aws s3 sync art/sheets/ "s3://$BUCKET/art/" --endpoint-url "$ENDPOINT" --exclude "*" \
              --include "$item.json" --include "$item-*.json" --cache-control "$JSON_CACHE" --no-progress
          done

      - name: Say if there's more to make
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/unfinished" ]; then
            echo "::error::This machine stopped before making all of its share, to send what it made within GitHub's time limit. Run the workflow again, with the same boxes ticked, for the rest: it carries on where this run stopped."
            exit 1
          fi
