<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		<meta name="robots" content="noindex"/>
		<title>{% block title %}Admin{% endblock %} ~ Social Empires</title>
		<link rel="icon" type="image/png" href="/img/icon.gif"/>
		<link rel="stylesheet" href="/css/brand.css"/>
		<style>
			/* The admin pages: brand.css's buttons, boxes and tooltips; plain tables. */
			body { margin: 0; background: var(--parchment-deep); color: var(--ink); font: 14px/1.45 var(--text); }
			header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: linear-gradient(#a3cf3c, #7fae1c); border-bottom: 3px solid var(--wood); font-family: var(--round); font-weight: 700; }
			header img { height: 32px; }
			header h1 { font-size: 18px; margin: 0; }
			header h1 a { color: var(--ink); text-decoration: none; }
			header .who { margin-left: auto; }
			main { max-width: 1100px; margin: 0 auto; padding: 16px; }
			section { background: var(--parchment); border: 2px solid var(--parchment-edge); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; overflow-x: auto; }
			h2 { font-size: 17px; margin: 0 0 10px; }
			a { color: #1f6fb2; }
			table { border-collapse: collapse; width: 100%; }
			th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--parchment-line); vertical-align: middle; }
			th { color: var(--ink-soft); font-weight: normal; white-space: nowrap; }
			.n { text-align: right; font-variant-numeric: tabular-nums; }
			code, pre { font: 12px Menlo, Consolas, monospace; }
			pre { background: #fff; border: 2px solid var(--parchment-edge); border-radius: 10px; padding: 10px; max-height: 600px; overflow: auto; }
			.muted { color: var(--ink-soft); }
			.stats { display: flex; gap: 32px; flex-wrap: wrap; }
			.stats b { display: block; font: 900 24px var(--round); }
			.done { background: #eaf6d6; border: 2px solid #9fcb5a; border-radius: 10px; color: #2f5a0c; padding: 8px 12px; margin-bottom: 16px; }
			.error { background: #ffe7e3; border: 2px solid #e58a7c; border-radius: 10px; color: #8a1d0e; padding: 8px 12px; margin-bottom: 16px; }
			.secret { font: bold 16px Menlo, Consolas, monospace; background: #fff8c4; padding: 2px 6px; }
			section.danger { border-color: #e58a7c; }
			.danger h2 { color: #a1281c; }
			form.inline { display: inline-flex; align-items: center; gap: 8px; margin: 0; }
			input[type=search], input[type=text] { height: 36px; width: 240px; }
			.badge { padding: 0 8px; border-radius: 8px; color: var(--ink); font: 700 11px/18px var(--text); background: var(--parchment-line); }
			.badge.unhandled { background: #fff1c4; }
			.badge.failed { background: #ffd4cc; }
			.badge.client { background: #d6e4ff; }
			.badge.refused { background: #e6d6ff; }
		</style>
	</head>
	<body>
		<header>
			<img src="/img/logo.png" alt=""/>
			<h1><a href="{{ url_for('admin.home') }}">Admin</a></h1>
			<span class="who">{{ admin.username }} · <a href="/">back to the game</a></span>
		</header>
		<main>
			{% block main %}{% endblock %}
		</main>
	</body>
</html>
