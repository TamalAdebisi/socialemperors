<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
        <meta name="theme-color" content="#181c14"/>
        <title>Social Empires</title>
        <link rel="icon" type="image/gif" href="img/icon.gif"/>
        <!-- The new game client (CLIENT.md), built from client/ by npm run build. -->
        <link rel="stylesheet" href="/css/brand.css"/>
        <link rel="stylesheet" href="/client/client.css"/>
        <script type="module" src="/client/client.js"></script>

    <body>
        <main id="stage"></main>
        <!-- What the client needs to talk to the server as this empire. -->
        <script id="se-settings" type="application/json">{{ {
            "userId": save_info.userid,
            "userKey": USER_KEY,
            "dynamicUrl": DYNAMIC,
            "artUrl": ART_URL,
            "assetsUrl": ASSETS_URL,
            "classicUrl": "/ruffle.html",
        } | tojson }}</script>
        <noscript><p class="status">The game needs JavaScript.</p></noscript>
    </body>
