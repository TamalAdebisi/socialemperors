<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30.1 -36.9 151.9 123.2">
  <!-- Food: a carrot of our own, drawn in the game's style (thick outline,
       glossy highlight), instead of the game's steak. -->
  <defs>
    <linearGradient id="carrot" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffc061"/>
      <stop offset="0.45" stop-color="#ff8f1f"/>
      <stop offset="1" stop-color="#e0640a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4ee6a"/>
      <stop offset="1" stop-color="#4fb02a"/>
    </linearGradient>
  </defs>
  <g transform="rotate(26)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the leaves, fanned out -->
    <g fill="url(#leaf)" stroke="#2c5612" stroke-width="6">
      <path d="M27 -8 C16 -22 6 -34 -2 -30 C-4 -18 10 -8 27 -3 Z"/>
      <path d="M27 7 C15 16 5 30 10 35 C20 32 26 20 30 9 Z"/>
      <path d="M26 0 C12 -8 -8 -10 -12 -2 C-6 8 12 6 26 2 Z"/>
    </g>
    <!-- the carrot: round shoulders, then a long taper -->
    <path d="M30 -24 C54 -26 82 -14 116 0 C82 14 54 26 30 24 C12 22 12 -22 30 -24 Z"
          fill="url(#carrot)" stroke="#6b3207" stroke-width="7"/>
    <!-- its rings -->
    <g fill="none" stroke="#c75606" stroke-width="4">
      <path d="M76 -14 L79 -7"/>
      <path d="M92 9 L94 3"/>
      <path d="M66 13 L69 19"/>
    </g>
    <!-- the shine -->
    <path d="M30 -16 C46 -19 62 -15 80 -9" fill="none" stroke="#fff" stroke-width="6" opacity="0.75"/>
  </g>
</svg>
